name: Deploy Chattogram Baper Rasta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Validate game HTML and JavaScript
        run: |
          test -s index.html
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.I)
          if not scripts:
              raise SystemExit("No inline game script found")
          Path("/tmp/chattogram-game-check.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/chattogram-game-check.js
      - name: Configure GitHub Pages
        # Ask the action to enable Pages when the repository token permits it.
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Verify game entry point
        run: test -s index.html
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
