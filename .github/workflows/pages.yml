name: Deploy Chattogram Baper Rasta

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configure GitHub Pages
        # The repository must have Pages enabled once in Settings → Pages.
        # The workflow token cannot enable the Pages site itself.
        uses: actions/configure-pages@v6
      - name: Verify game entry point
        run: test -s index.html
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
